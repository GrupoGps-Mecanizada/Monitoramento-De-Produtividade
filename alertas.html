<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1f3864">
<title>Alertas — Monitoramento GrupoGPS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%231f3864%22/><path d=%22M50 18c-13 0-23 10-23 23 0 17 23 41 23 41s23-24 23-41c0-13-10-23-23-23z%22 fill=%22%230ca30c%22/><circle cx=%2250%22 cy=%2241%22 r=%229%22 fill=%22%231f3864%22/></svg>">
<link rel="stylesheet" href="theme.css">
<style>
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
*, *::before, *::after { box-sizing: border-box; }

/* layout */
.al-main { flex: 1; min-height: 0; display: grid; grid-template-columns: 340px minmax(0,1fr); gap: var(--sp-3); padding: var(--sp-3) var(--sp-4) var(--sp-4); }

/* painel esquerdo */
.al-painel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--sh-1); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.al-topo { padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: var(--sp-2); flex-shrink: 0; }
.al-corpo { flex: 1; overflow-y: auto; min-height: 0; }

/* painel direito */
.al-detalhe { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--sh-1); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.al-detalhe-topo { padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: var(--sp-3); flex-shrink: 0; }
.al-detalhe-corpo { flex: 1; overflow-y: auto; min-height: 0; padding: var(--sp-4); }

/* kpis de alertas */
.al-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp-2); padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.al-kpi { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-md); padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; cursor: pointer; transition: border-color .13s, background .13s; }
.al-kpi:hover { background: var(--surface-3); }
.al-kpi.ativo { border-color: var(--acento); background: color-mix(in srgb, var(--acento) 8%, var(--surface)); }
.al-kpi-val { font-size: 20px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.al-kpi-label { font-size: 10px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: .05em; }

/* item de alerta na lista */
.al-item { display: grid; grid-template-columns: 30px minmax(0,1fr) auto; gap: 3px 10px; align-items: center; padding: 10px var(--sp-4); border-bottom: 1px solid var(--border); cursor: pointer; width: 100%; text-align: left; border-left: 0; border-right: 0; border-top: 0; background: none; font: inherit; color: inherit; transition: background .12s; }
.al-item:hover { background: var(--surface-2); }
.al-item.sel { background: var(--brand-soft); }
.al-item.nao-lido { border-left: 3px solid var(--acento, var(--brand-2)); padding-left: calc(var(--sp-4) - 3px); }
.al-ic { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 800; }
.al-placa { font-weight: 700; font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
.al-desc { grid-column: 2; font-size: 11.5px; color: var(--text-2); line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.al-hora { font-size: 10.5px; color: var(--text-3); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* grupo de data */
.al-grupo-data { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; padding: 6px var(--sp-4); background: var(--surface-2); border-bottom: 1px solid var(--border); font-size: 10.5px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: .05em; }
.al-grupo-data .cnt { margin-left: auto; font-variant-numeric: tabular-nums; }

/* detalhe do alerta */
.al-det-placa { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
.al-det-tipo { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: var(--r-full); font-size: 11px; font-weight: 700; }
.al-det-campo { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; font-size: 12.5px; padding: var(--sp-4) 0; border-bottom: 1px solid var(--border); margin-bottom: var(--sp-4); }
.al-det-campo dt { color: var(--text-3); font-weight: 600; font-size: 11.5px; }
.al-det-campo dd { margin: 0; font-weight: 500; }

/* linha do tempo do veiculo no dia */
.al-historico-linha { position: relative; padding-left: 28px; display: flex; flex-direction: column; gap: 0; }
.al-historico-linha::before { content: ''; position: absolute; left: 10px; top: 8px; bottom: 8px; width: 2px; background: var(--border); }
.al-hev { position: relative; padding: 8px 0; }
.al-hev::before { content: ''; position: absolute; left: -22px; top: 12px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--surface); background: var(--c, var(--neutral)); }
.al-hev.destaque::before { width: 14px; height: 14px; left: -24px; top: 10px; border-width: 3px; }
.al-hev-hora { font-size: 10px; color: var(--text-3); font-weight: 700; font-variant-numeric: tabular-nums; margin-bottom: 2px; }
.al-hev-txt { font-size: 12px; color: var(--text-2); line-height: 1.4; }
.al-hev-txt b { color: var(--text); }

/* vazio */
.al-vazio { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; padding: 48px 20px; color: var(--text-3); gap: var(--sp-2); text-align: center; }
.al-vazio-titulo { font-size: 13px; font-weight: 600; color: var(--text-2); }
.al-vazio-sub { font-size: 12px; max-width: 260px; line-height: 1.5; }

.spin { width: 24px; height: 24px; border-radius: 50%; border: 3px solid var(--border); border-top-color: var(--brand-2); animation: girar .8s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }

/* busca / filtros */
.al-linha-filtro { display: grid; grid-template-columns: 120px 1fr; gap: var(--sp-2); }

/* responsivo */
@media (max-width: 960px) {
  .al-main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="api-supabase.js"></script>
<link rel="stylesheet" href="mobile.css">
<script src="mobile.js" defer></script>
</head>
<body>

<header class="app-header">
  <div class="app-header-inner">
    <div class="brand">
      <div class="brand-mark">GPS</div>
      <div class="brand-text">
        <strong>Monitoramento de Localizacao</strong>
        <span>GrupoGPS Usiminas</span>
      </div>
    </div>
    <nav class="nav">
      <a href="./">Localização</a>
      <a href="timeline.html">Timeline</a>
      <a href="alertas.html" class="ativo">Alertas</a>
    </nav>
    <div class="header-right">
      <span class="live-chip" id="chipStatus"><span class="live-dot"></span><span id="txtStatus">carregando...</span></span>
      <button class="icon-btn" id="btnTema" title="Alternar tema" aria-label="Alternar tema">&#9790;</button>
    </div>
  </div>
</header>

<main class="al-main">

  <!-- painel esquerdo: lista de alertas -->
  <section class="al-painel" aria-label="Lista de alertas">

    <!-- kpis por tipo -->
    <div class="al-kpis" id="alKpis"></div>

    <!-- filtros -->
    <div class="al-topo">
      <div class="al-linha-filtro">
        <select class="input" id="diaSel"></select>
        <input class="input" type="search" id="buscaAl" placeholder="Placa ou area..." autocomplete="off">
      </div>
      <div class="chips" id="chipsAl"></div>
    </div>

    <!-- lista -->
    <div class="al-corpo" id="alCorpo">
      <div class="al-vazio">
        <div class="spin"></div>
        <div class="al-vazio-titulo">Carregando alertas...</div>
      </div>
    </div>
  </section>

  <!-- painel direito: detalhe -->
  <section class="al-detalhe" aria-label="Detalhe do alerta">
    <div class="al-detalhe-topo" id="alDetTopo">
      <div style="color:var(--text-3);font-size:12px">Selecione um evento na lista</div>
    </div>
    <div class="al-detalhe-corpo" id="alDetCorpo">
      <div class="al-vazio" style="height:100%">
        <div class="al-vazio-titulo">Nenhum evento selecionado</div>
        <div class="al-vazio-sub">Clique em qualquer item da lista para ver os detalhes e o contexto do veiculo naquele momento.</div>
      </div>
    </div>
  </section>

</main>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = (n) => String(n).padStart(2,'0');
const diaLocal = (d = new Date()) => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hora = (iso) => iso ? new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '--';
const horaSeg = (iso) => iso ? new Date(iso).toLocaleTimeString('pt-BR') : '--';
const dataHora = (iso) => iso ? new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '--';

function fmtMin(min) {
  if (min == null || isNaN(min)) return '--';
  min = Math.round(min);
  if (min < 60) return min+' min';
  if (min < 1440) return Math.floor(min/60)+'h'+pad(min%60);
  return Math.floor(min/1440)+'d '+Math.floor((min%1440)/60)+'h';
}

/* tipos de evento */
const TIPOS = {
  entrada:        { label: 'Entrada',       cor: '#16a34a', bg: '#dcfce7', ic: 'E', grupo: 'entrada' },
  saida:          { label: 'Saida',         cor: '#2f5496', bg: '#dbeafe', ic: 'S', grupo: 'saida'   },
  status:         { label: 'Status',        cor: '#7c3aed', bg: '#ede9fe', ic: 'T', grupo: 'status'  },
  sinal_perdido:  { label: 'Sem sinal',     cor: '#dc2626', bg: '#fee2e2', ic: '!', grupo: 'sinal'   },
  sinal_retomado: { label: 'Sinal voltou',  cor: '#0ca30c', bg: '#dcfce7', ic: 'V', grupo: 'sinal'   },
};

const GRUPOS = {
  entrada: { label: 'Entradas', cor: '#16a34a', bg: '#dcfce7' },
  saida:   { label: 'Saidas',   cor: '#2f5496', bg: '#dbeafe' },
  status:  { label: 'Status',   cor: '#7c3aed', bg: '#ede9fe' },
  sinal:   { label: 'Sinal',    cor: '#dc2626', bg: '#fee2e2' },
};

/* tema */
function aplicarTema(t) {
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('gps-tema', t); } catch {}
  $('#btnTema').textContent = t === 'dark' ? '\u2600' : '\u263E';
}
{
  let t = null;
  try { t = localStorage.getItem('gps-tema'); } catch {}
  aplicarTema(t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
}
$('#btnTema').onclick = () => aplicarTema(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');

/* estado */
const S = {
  eventos: [],
  dia: diaLocal(),
  filtroGrupos: new Set(['entrada','saida','status','sinal']),
  busca: '',
  sel: null,
  lidos: new Set(),
  snap: null,
};

/* ── carregar dias ── */
async function carregarDias() {
  let dias = [];
  try { dias = await (await fetch('/api/dias')).json(); } catch {}
  const hoje = diaLocal();
  if (!dias.includes(hoje)) dias.unshift(hoje);
  S.dia = hoje;
  $('#diaSel').innerHTML = dias.map(d => '<option value="'+d+'">'+(d===hoje?'Hoje':d.split('-').reverse().join('/'))+'</option>').join('');
}
$('#diaSel').onchange = (e) => { S.dia = e.target.value; carregarEventos(); };

/* ── carregar eventos ── */
async function carregarEventos() {
  try {
    S.eventos = await (await fetch('/api/eventos?dia='+S.dia)).json();
    S.eventos.sort((a,b) => b.t.localeCompare(a.t));
  } catch { S.eventos = []; }
  renderKpis();
  renderChips();
  renderLista();
  atualizarStatus();
}

/* ── carregar estado (para detalhe de veiculo) ── */
async function carregarSnap() {
  try { S.snap = await (await fetch('/api/estado')).json(); } catch {}
}

/* ── KPIs ── */
function renderKpis() {
  const conta = {};
  S.eventos.forEach(e => {
    const g = grupoTipo(e.tipo);
    conta[g] = (conta[g]??0)+1;
  });
  const total = S.eventos.length;
  $('#alKpis').innerHTML = [
    {id:'todos', label:'Total', cor:'var(--brand-2)', acento:'var(--brand-2)'},
    ...Object.entries(GRUPOS).map(([k,g]) => ({id:k, label:g.label, cor:g.cor, acento:g.cor}))
  ].map(k => {
    const n = k.id==='todos' ? total : (conta[k.id]??0);
    const ativo = k.id==='todos' ? S.filtroGrupos.size===4 : S.filtroGrupos.size<4 && S.filtroGrupos.has(k.id) && S.filtroGrupos.size===1;
    return '<button class="al-kpi'+(ativo?' ativo':'')+'" data-kpi="'+k.id+'" style="--acento:'+k.acento+'"><span class="al-kpi-val" style="color:'+k.cor+'">'+n+'</span><span class="al-kpi-label">'+k.label+'</span></button>';
  }).join('');
}
$('#alKpis').onclick = (e) => {
  const b = e.target.closest('[data-kpi]');
  if (!b) return;
  const id = b.dataset.kpi;
  if (id==='todos') {
    S.filtroGrupos = new Set(['entrada','saida','status','sinal']);
  } else {
    if (S.filtroGrupos.size===4 || !S.filtroGrupos.has(id)) {
      S.filtroGrupos = new Set([id]);
    } else {
      S.filtroGrupos = new Set(['entrada','saida','status','sinal']);
    }
  }
  renderKpis();
  renderChips();
  renderLista();
};

/* ── chips ── */
function renderChips() {
  $('#chipsAl').innerHTML = Object.entries(GRUPOS).map(([k,g]) =>
    '<button class="chip'+(S.filtroGrupos.has(k)?' ativo':'')+'" data-grupo="'+k+'" style="--c:'+g.cor+'">'+
    '<span class="pt" style="background:'+g.cor+'"></span>'+g.label+
    '<span class="cnt">'+((S.eventos.filter(e=>grupoTipo(e.tipo)===k)).length)+'</span>'+
    '</button>'
  ).join('');
}
$('#chipsAl').onclick = (e) => {
  const b = e.target.closest('[data-grupo]');
  if (!b) return;
  const k = b.dataset.grupo;
  if (S.filtroGrupos.has(k)) { S.filtroGrupos.delete(k); if (!S.filtroGrupos.size) S.filtroGrupos = new Set(['entrada','saida','status','sinal']); }
  else { S.filtroGrupos.add(k); }
  renderKpis(); renderChips(); renderLista();
};
$('#buscaAl').oninput = (e) => { S.busca = e.target.value.trim().toUpperCase(); renderLista(); };

/* ── lista ── */
function grupoTipo(tipo) {
  if (tipo.startsWith('sinal')) return 'sinal';
  return tipo;
}

function textoEvento(ev) {
  // evento do motor secundário (placa + "2") aparece no caminhão dele
  const p = ev.motor2 ? '<b>'+esc(ev.principal ?? ev.placa)+'</b> ⚙ motor 2º' : '<b>'+esc(ev.placa)+'</b>';
  switch (ev.tipo) {
    case 'entrada':         return p+' entrou em <b>'+esc(ev.area)+'</b>';
    case 'saida':           return p+' saiu de <b>'+esc(ev.area)+'</b>'+(ev.permanencia_min!=null?' (ficou '+fmtMin(ev.permanencia_min)+')':'');
    case 'status':          return p+' '+esc(ev.de)+' -> <b>'+esc(ev.para)+'</b>'+(ev.area?' em '+esc(ev.area):'');
    case 'sinal_perdido':   return p+' sem sinal desde '+hora(ev.ultima_posicao)+(ev.area?' em '+esc(ev.area):'');
    case 'sinal_retomado':  return p+' voltou a comunicar'+(ev.sem_sinal_min!=null?' apos '+fmtMin(ev.sem_sinal_min):'');
    default:                return p+' '+esc(ev.tipo);
  }
}

function renderLista() {
  const lista = S.eventos.filter(e =>
    S.filtroGrupos.has(grupoTipo(e.tipo)) &&
    (!S.busca || (e.placa+' '+(e.area??'')).toUpperCase().includes(S.busca))
  );

  if (!lista.length) {
    $('#alCorpo').innerHTML = '<div class="al-vazio"><div class="al-vazio-titulo">Nenhum evento encontrado</div><div class="al-vazio-sub">Ajuste os filtros ou escolha outro dia.</div></div>';
    return;
  }

  /* agrupa por hora (bloco de 1h) */
  const grupos = {};
  for (const ev of lista) {
    const h = ev.t.slice(0,13)+'h'; // "2026-09-30T14h"
    (grupos[h] ??= []).push(ev);
  }
  const chaves = Object.keys(grupos).sort((a,b) => b.localeCompare(a));

  $('#alCorpo').innerHTML = chaves.map(h => {
    const evs = grupos[h];
    const horaTxt = evs[0].t.slice(11,13)+':00 – '+evs[0].t.slice(11,13)+':59';
    return '<div class="al-grupo-data"><span>'+horaTxt+'</span><span class="cnt">'+evs.length+'</span></div>'+
      evs.map(ev => {
        const t = TIPOS[ev.tipo] ?? {label:ev.tipo, cor:'#888', bg:'#eee', ic:'?'};
        const lido = S.lidos.has(ev._idx ?? ev.t+ev.placa);
        const ativo = S.sel === (ev._idx ?? ev.t+ev.placa);
        return '<button class="al-item'+(ativo?' sel':'')+(lido?'':' nao-lido')+'" data-ev-key="'+(ev._idx ?? ev.t+ev.placa)+'" style="--acento:'+t.cor+'">'+'<span class="al-ic" style="background:'+t.bg+';color:'+t.cor+'">'+t.ic+'</span>'+'<span class="al-placa">'+esc(ev.placa)+'</span>'+'<span class="al-desc">'+textoEvento(ev)+'</span>'+'<span class="al-hora">'+hora(ev.t)+'</span>'+'</button>';
      }).join('');
  }).join('');

  /* clique no item */
  $('#alCorpo').onclick = (e) => {
    const b = e.target.closest('[data-ev-key]');
    if (!b) return;
    const key = b.dataset.evKey;
    S.lidos.add(key);
    S.sel = key;
    renderLista();
    const ev = lista.find(x => (x._idx??x.t+x.placa) === key);
    if (ev) abrirDetalhe(ev);
  };
}

/* ── detalhe ── */
function abrirDetalhe(ev) {
  const t = TIPOS[ev.tipo] ?? {label:ev.tipo, cor:'#888', bg:'#eee', ic:'?'};

  /* topo */
  $('#alDetTopo').innerHTML =
    '<div style="flex:1;min-width:0">'+
      '<div class="al-det-placa">'+esc(ev.placa)+'</div>'+
      '<div style="margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">'+
        '<span class="al-det-tipo" style="background:'+t.bg+';color:'+t.cor+'">'+t.ic+' '+t.label+'</span>'+
        '<span style="font-size:11.5px;color:var(--text-3)">'+dataHora(ev.t)+'</span>'+
      '</div>'+
    '</div>'+
    '<button class="btn btn-neutro btn-mini" id="btnVerTimeline" title="Abrir timeline deste veiculo neste dia">Ver timeline</button>';

  $('#btnVerTimeline').onclick = () => {
    const dia = ev.t.slice(0,10);
    window.open('timeline.html?v='+encodeURIComponent(ev.id)+'&dia='+dia,'_blank');
  };

  /* campos */
  const campos = [];
  if (ev.area)            campos.push(['Area',          esc(ev.area)]);
  if (ev.de)              campos.push(['De',            esc(ev.de)]);
  if (ev.para)            campos.push(['Para',          '<b>'+esc(ev.para)+'</b>']);
  if (ev.duracao_min!=null) campos.push(['Duracao anterior', fmtMin(ev.duracao_min)]);
  if (ev.permanencia_min!=null) campos.push(['Permanencia',  fmtMin(ev.permanencia_min)]);
  if (ev.ultima_posicao)  campos.push(['Ultima posicao', horaSeg(ev.ultima_posicao)]);
  if (ev.sem_sinal_min!=null)   campos.push(['Sem sinal por',  fmtMin(ev.sem_sinal_min)]);
  if (ev.via)             campos.push(['Via',           esc(ev.via)]);

  const camposHTML = campos.length ?
    '<dl class="al-det-campo">'+campos.map(([k,v]) => '<dt>'+k+'</dt><dd>'+v+'</dd>').join('')+'</dl>' : '';

  /* historico do veiculo no mesmo dia (eventos) */
  const chave = ev._idx ?? ev.t+ev.placa;
  const mesmoVeiculo = S.eventos.filter(e => e.id === ev.id && e.t.slice(0,10) === ev.t.slice(0,10))
                                 .sort((a,b) => b.t.localeCompare(a.t));

  const histHTML = mesmoVeiculo.length > 1 ? `
    <div style="font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:var(--sp-3)">Outros eventos de `+esc(ev.placa)+` hoje</div>
    <div class="al-historico-linha">
      `+mesmoVeiculo.map(e => {
        const tp = TIPOS[e.tipo] ?? {label:e.tipo, cor:'#888', bg:'#eee', ic:'?'};
        const destaque = (e._idx??e.t+e.placa) === chave;
        return '<div class="al-hev'+(destaque?' destaque':'')+'" style="--c:'+tp.cor+'"><div class="al-hev-hora">'+hora(e.t)+'</div><div class="al-hev-txt">'+tp.ic+' '+textoEvento(e)+'</div></div>';
      }).join('')+`
    </div>` : '';

  $('#alDetCorpo').innerHTML = camposHTML + histHTML;
}

/* ── status ── */
function atualizarStatus() {
  $('#txtStatus').textContent = S.eventos.length+' eventos · '+((S.dia===diaLocal())?'hoje':S.dia.split('-').reverse().join('/'));
}

/* ── SSE para eventos em tempo real (dia de hoje) ── */
const sse = new EventSource('/api/stream');
sse.addEventListener('eventos', (e) => {
  if (S.dia !== diaLocal()) return;
  const novos = JSON.parse(e.data);
  S.eventos.unshift(...novos);
  S.eventos.sort((a,b) => b.t.localeCompare(a.t));
  renderKpis();
  renderChips();
  renderLista();
  atualizarStatus();
});
sse.onerror = () => { $('#chipStatus')?.classList.add('alerta'); };

/* ── iniciar ── */
async function iniciar() {
  await Promise.all([carregarDias(), carregarSnap()]);
  await carregarEventos();

  /* link direto ?placa=ABC1234 */
  const p = new URLSearchParams(location.search);
  if (p.get('placa')) {
    $('#buscaAl').value = p.get('placa').toUpperCase();
    S.busca = p.get('placa').toUpperCase();
    renderLista();
  }
}
iniciar();
</script>
