name: Coletor de localização (GAUSS -> Supabase)

# Quem dispara a cada 5 min é o Supabase (pg_cron + pg_net, supabase/disparo.sql),
# e também na hora de cada pedido de histórico. O "schedule" do GitHub foi retirado:
# demorou mais de 1h para começar e atrasa/pula execuções - e junto com o Supabase
# rodaria em dobro.
on:
  workflow_dispatch: # chamado pelo Supabase; também é o botão "Run workflow"
  # roda também quando o código do coletor muda (valida a mudança na hora)
  push:
    branches: [main]
    paths: ['coletor/**', '.github/workflows/coletor.yml']

# nunca duas execuções ao mesmo tempo (evita requisições em dobro ao GAUSS)
concurrency:
  group: coletor-localizacao
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: coletor
    env:
      TZ: America/Sao_Paulo
      GAUSSFLEET_USERNAME: ${{ secrets.GAUSSFLEET_USERNAME }}
      GAUSSFLEET_PASSWORD: ${{ secrets.GAUSSFLEET_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: coletor/package-lock.json
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: node run.js
