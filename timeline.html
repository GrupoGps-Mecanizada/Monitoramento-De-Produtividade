<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1f3864">
<title>Timeline — Monitoramento GrupoGPS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%231f3864%22/><path d=%22M50 18c-13 0-23 10-23 23 0 17 23 41 23 41s23-24 23-41c0-13-10-23-23-23z%22 fill=%22%230ca30c%22/><circle cx=%2250%22 cy=%2241%22 r=%229%22 fill=%22%231f3864%22/></svg>">
<link rel="stylesheet" href="theme.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .tl-main { flex: 1; min-height: 0; display: grid; grid-template-columns: 360px minmax(0,1fr); gap: var(--sp-3); padding: var(--sp-3) var(--sp-4) var(--sp-4); }
  .tl-painel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--sh-1); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .tl-topo { padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: var(--sp-2); flex-shrink: 0; }
  .tl-topo-linha { display: grid; grid-template-columns: 1fr auto; gap: var(--sp-2); align-items: end; }
  .tl-corpo { flex: 1; overflow-y: auto; min-height: 0; }
  .busca-wrap { position: relative; }
  .busca-wrap .input { width: 100%; padding-right: 30px; }
  .busca-dropdown { position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 99; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--sh-3); max-height: 220px; overflow-y: auto; }
  .busca-dropdown button { width: 100%; text-align: left; padding: 9px 12px; border: none; border-bottom: 1px solid var(--border); background: none; font: inherit; color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .busca-dropdown button:last-child { border-bottom: none; }
  .busca-dropdown button:hover { background: var(--surface-2); }
  .busca-dropdown .dd-placa { font-weight: 700; font-size: 12.5px; }
  .busca-dropdown .dd-vaga { font-size: 11px; color: var(--text-3); margin-left: auto; }
  .busca-dropdown .dd-vazio { padding: 12px; text-align: center; color: var(--text-3); font-size: 12px; }
  .tl-veiculo-header { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .tl-placa { font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
  .tl-vaga { font-size: 11.5px; color: var(--text-3); font-weight: 600; }
  .tl-veiculo-info { flex: 1; min-width: 0; }
  .resumo-grade { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); border-bottom: 1px solid var(--border); }
  .resumo-cel { background: var(--surface); padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; }
  .resumo-cel .rc-val { font-size: 17px; font-weight: 700; letter-spacing: -.015em; }
  .resumo-cel .rc-label { font-size: 10.5px; color: var(--text-3); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .barra-tempo-wrap { padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .barra-tempo-titulo { font-size: 10px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
  .barra-tempo { position: relative; height: 22px; border-radius: 6px; overflow: hidden; background: var(--surface-3); display: flex; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
  .barra-m2 { position: relative; height: 7px; margin-top: 3px; border-radius: 4px; background: var(--surface-3); cursor: pointer; }
  .barra-m2 span { position: absolute; top: 0; bottom: 0; background: #0891b2; border-radius: 2px; }
  .barra-m2-rot { font-size: 9.5px; color: var(--text-3); margin-top: 2px; }
  .cursor-play { position: absolute; top: -2px; bottom: -2px; width: 3px; margin-left: -1px; background: #fff; box-shadow: 0 0 0 1px #0b1220, 0 0 6px rgba(0,0,0,.6); pointer-events: none; z-index: 2; }
  .player { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .player .input { padding: 4px 6px; font-size: 12px; }
  .player label { font-size: 11.5px; color: var(--text-2); display: inline-flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap; }
  .play-info { margin-top: 8px; font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; min-height: 18px; }
  .play-info b { color: var(--text); }
  .mk-play { position: absolute; transform: translate(-50%, -50%); display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--c, #0ea5e9); border: 3px solid #fff; box-shadow: 0 0 0 2px #0b1220, 0 2px 10px rgba(0,0,0,.6); color: #fff; font-size: 15px; }
  .mk-play .seta-play { display: block; line-height: 1; transition: transform .15s linear; }
  .mk-play .m2 { position: absolute; right: -9px; top: -9px; width: 18px; height: 18px; border-radius: 50%; background: #0891b2; border: 2px solid #fff; font-size: 10px; display: grid; place-items: center; }
  .play-hud { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 500; background: rgba(11,18,32,.88); color: #fff; border-radius: 10px; padding: 6px 14px; font-size: 13px; font-variant-numeric: tabular-nums; box-shadow: var(--sh-2); display: none; white-space: nowrap; }
  .play-hud.vis { display: block; }
  .play-hud b { font-size: 18px; margin-right: 8px; }
  .barra-tempo span { display: block; height: 100%; }
  .barra-horas { display: flex; justify-content: space-between; margin-top: 4px; }
  .barra-horas span { font-size: 9.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .secao-label { padding: 6px var(--sp-4); font-size: 10px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: .07em; }
  .trecho-item { display: grid; grid-template-columns: 36px minmax(0,1fr) 76px; gap: 4px 10px; align-items: start; padding: 10px var(--sp-4); border-bottom: 1px solid var(--border); cursor: pointer; width: 100%; text-align: left; border-left: 0; border-right: 0; border-top: 0; background: none; font: inherit; color: inherit; transition: background .12s; }
  .trecho-item:hover { background: var(--surface-2); }
  .trecho-item.sel { background: var(--brand-soft); }
  .trecho-ic { grid-column: 1; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; font-weight: 700; grid-row: 1 / 3; }
  .trecho-desc { grid-column: 2; grid-row: 1; font-size: 12.5px; font-weight: 600; color: var(--text); line-height: 1.3; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trecho-sub { grid-column: 2; grid-row: 2; font-size: 11px; color: var(--text-2); line-height: 1.4; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trecho-hora { grid-column: 3; font-size: 10.5px; color: var(--text-3); font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; line-height: 1.4; grid-row: 1 / 3; }
  .trecho-dur { font-weight: 700; font-size: 12px; color: var(--text-2); }
  .tl-mapa-wrap { position: relative; min-height: 0; border-radius: var(--r-lg); overflow: hidden; border: 1px solid var(--border); box-shadow: var(--sh-1); }
  #mapa { position: absolute; inset: 0; background: var(--surface-3); }
  .tl-vazio { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; padding: 48px 20px; color: var(--text-3); gap: var(--sp-3); text-align: center; }
  .tl-vazio-ico { font-size: 40px; opacity: .25; }
  .tl-vazio-titulo { font-size: 13px; font-weight: 600; color: var(--text-2); }
  .tl-vazio-sub { font-size: 12px; max-width: 240px; line-height: 1.5; }
  .spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--border); border-top-color: var(--brand-2); animation: girar .8s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }
  .legenda-mapa { position: absolute; left: 10px; bottom: 22px; z-index: 500; background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--border); border-radius: var(--r-md); padding: 8px 10px; box-shadow: var(--sh-2); display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--text-2); }
  .legenda-mapa div { display: flex; align-items: center; gap: 6px; }
  .legenda-mapa i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
  .mapa-info { position: absolute; right: 10px; top: 10px; z-index: 500; background: color-mix(in srgb, var(--surface) 95%, transparent); border: 1px solid var(--border); border-radius: var(--r-md); padding: 10px 13px; box-shadow: var(--sh-2); font-size: 11.5px; max-width: 220px; display: none; }
  .mapa-info.vis { display: block; }
  .mapa-info-placa { font-size: 14px; font-weight: 800; margin-bottom: 4px; }
  .mapa-info-linha { color: var(--text-2); margin-bottom: 2px; }
  .mapa-info-linha b { color: var(--text); }
  @media (max-width: 960px) {
    .tl-main { grid-template-columns: 1fr; grid-template-rows: auto 55vh; padding: var(--sp-2) var(--sp-3) var(--sp-3); }
    .tl-mapa-wrap { grid-row: 1; }
    .tl-painel { grid-row: 2; }
    .legenda-mapa { display: none; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>

<body>
<header class="app-header">
  <div class="app-header-inner">
    <div class="brand">
      <div class="brand-mark">GPS</div>
      <div class="brand-text">
        <strong>Monitoramento de Localizacao</strong>
        <span>GrupoGPS Usiminas</span>
      </div>
    </div>
    <nav class="nav">
      <a href="./">Localização</a>
      <a href="timeline.html" class="ativo">Timeline</a>
      <a href="alertas.html">Alertas</a>
    </nav>
    <div class="header-right">
      <button class="btn btn-neutro btn-mini" id="btnCSV" disabled>Exportar CSV</button>
      <button class="icon-btn" id="btnTema" title="Alternar tema" aria-label="Alternar tema">&#9790;</button>
    </div>
  </div>
</header>

<main class="tl-main">
  <section class="tl-painel" aria-label="Selecao e timeline do veiculo">
    <div class="tl-topo">
      <div class="tl-topo-linha">
        <div class="campo" style="flex:1">
          <label for="busca">Veiculo</label>
          <div class="busca-wrap">
            <input class="input" type="search" id="busca" placeholder="Placa, vaga ou motorista..." autocomplete="off">
            <div class="busca-dropdown" id="buscaDropdown" hidden></div>
          </div>
        </div>
        <div class="campo">
          <label for="diaSel">Dia</label>
          <select class="input" id="diaSel" style="min-width:120px"></select>
        </div>
      </div>
      <div style="display:flex;gap:var(--sp-2);align-items:center">
        <button class="btn btn-primario btn-mini" id="btnCarregar" disabled>Ver timeline</button>
        <span id="txtStatus" style="font-size:11px;color:var(--text-3)"></span>
      </div>
    </div>
    <div class="tl-corpo" id="tlCorpo">
      <div class="tl-vazio">
        
        <div class="tl-vazio-titulo">Selecione um veiculo</div>
        <div class="tl-vazio-sub">Escolha a placa e o dia para visualizar a rota e o apontamento completo.</div>
      </div>
    </div>
  </section>
  <div class="tl-mapa-wrap">
    <div id="mapa"></div>
    <div class="legenda-mapa" id="legenda"></div>
    <div class="mapa-info" id="mapaInfo"></div>
    <div class="play-hud" id="playHud"></div>
  </div>
</main>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = (n) => String(n).padStart(2,'0');
const diaLocal = (d = new Date()) => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());

function fmtMin(min) {
  if (min == null || isNaN(min)) return '--';
  min = Math.round(min);
  if (min < 60) return min+' min';
  if (min < 1440) return Math.floor(min/60)+'h'+pad(min%60);
  return Math.floor(min/1440)+'d '+Math.floor((min%1440)/60)+'h';
}

const ESTADOS = {
  movimento:     { label: 'Em deslocamento', hex: '#0ea5e9', ic: '&#9658;', icBg: '#e0f2fe' },
  parado_ligado: { label: 'Parado ligado',   hex: '#eab308', ic: '◐', icBg: '#fef9c3' },
  desligado:     { label: 'Desligado',       hex: '#dc2626', ic: '■', icBg: '#fee2e2' },
  parado:        { label: 'Parado',          hex: '#6b7280', ic: '■', icBg: '#f3f4f6' },
  sem_sinal:     { label: 'Sem sinal',       hex: '#9ca3af', ic: '!', icBg: '#f9fafb' },
};

function aplicarTema(t) {
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('gps-tema', t); } catch {}
  $('#btnTema').textContent = t === 'dark' ? '\u2600' : '\u263E';
}
{
  let t = null;
  try { t = localStorage.getItem('gps-tema'); } catch {}
  aplicarTema(t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
}
$('#btnTema').onclick = () => aplicarTema(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');

const satelite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{ maxZoom:21, maxNativeZoom:18, attribution:'Imagens Esri' });
const ruas = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{ maxZoom:21, maxNativeZoom:19, attribution:'OpenStreetMap' });
const mapa = L.map('mapa', { layers:[satelite], zoomControl:true, maxZoom:21 }).setView([-19.48,-42.53],13);
L.control.layers({'Satelite': satelite,'Mapa': ruas}).addTo(mapa);
const camadaRota = L.layerGroup().addTo(mapa);
const camadaPts  = L.layerGroup().addTo(mapa);

$('#legenda').innerHTML = Object.entries(ESTADOS).map(([,e]) => '<div><i style="background:'+e.hex+';border-radius:2px"></i>'+e.label+'</div>').join('');

const S = { sel:null, hist:null, diaEscolhido:diaLocal(), trechoSel:null };
let todosVeiculos = [];
let secundarios = [];

async function carregarVeiculos() {
  try {
    const snap = await (await fetch('/api/estado')).json();
    // motor secundário (placa + "2") não é outro caminhão: o histórico dele vem junto do principal
    todosVeiculos = (snap.veiculos ?? []).sort((a,b) => a.placa.localeCompare(b.placa));
    secundarios = todosVeiculos.filter(v => v.motor2_de);
    todosVeiculos = todosVeiculos.filter(v => !v.motor2_de);
  } catch { todosVeiculos = []; }
}

const buscaEl = $('#busca');
const ddEl    = $('#buscaDropdown');

function filtrarDropdown(q) {
  q = q.trim().toUpperCase();
  const lista = q ? todosVeiculos.filter(v => [v.placa,v.vaga,v.motorista].join(' ').toUpperCase().includes(q)) : todosVeiculos.slice(0,30);
  if (!lista.length) {
    ddEl.innerHTML = '<div class="dd-vazio">Nenhum veiculo encontrado</div>';
  } else {
    ddEl.innerHTML = lista.map(v => '<button data-id="'+esc(v.id)+'" data-placa="'+esc(v.placa)+'" data-vaga="'+esc(v.vaga||'')+'"><span class="dd-placa">'+esc(v.placa)+(v.motor2?' <span title="tem motor secundário" style="color:#0891b2">⚙</span>':'')+'</span><span style="font-size:11px;color:var(--text-2)">'+esc(v.status||'')+'</span><span class="dd-vaga">'+esc(v.vaga||'')+'</span></button>').join('');
  }
  ddEl.hidden = false;
}

buscaEl.addEventListener('input', () => filtrarDropdown(buscaEl.value));
buscaEl.addEventListener('focus', () => filtrarDropdown(buscaEl.value));
document.addEventListener('click', (e) => { if (!e.target.closest('#busca') && !e.target.closest('#buscaDropdown')) ddEl.hidden = true; });
ddEl.addEventListener('click', (e) => {
  const b = e.target.closest('[data-id]');
  if (!b) return;
  S.sel = { id: b.dataset.id, placa: b.dataset.placa, vaga: b.dataset.vaga };
  buscaEl.value = b.dataset.placa;
  ddEl.hidden = true;
  $('#btnCarregar').disabled = false;
});

async function carregarDias() {
  // a rota do GAUSS existe para qualquer dia (não só os que têm eventos gravados):
  // oferece os últimos 30 dias
  const hoje = diaLocal();
  const dias = Array.from({ length: 30 }, (_, i) => diaLocal(new Date(Date.now() - i * 86400000)));
  S.diaEscolhido = hoje;
  $('#diaSel').innerHTML = dias.map((d, i) => '<option value="'+d+'">'+(i===0?'Hoje':i===1?'Ontem':d.split('-').reverse().join('/'))+'</option>').join('');
}
$('#diaSel').onchange = (e) => { S.diaEscolhido = e.target.value; };
$('#btnCarregar').onclick = carregarHistorico;

async function carregarHistorico() {
  if (!S.sel) return;
  const btn = $('#btnCarregar');
  btn.disabled = true;
  S.hist = null; S.trechoSel = null;
  Player.limpar();
  $('#btnCSV').disabled = true;
  $('#tlCorpo').innerHTML = '<div class="tl-vazio"><div class="spin"></div><div class="tl-vazio-titulo">Buscando historico...</div><div class="tl-vazio-sub">Se este dia ainda não está no banco, o pedido vai para o coletor (roda a cada ~5 min no GitHub) e a página mostra sozinha quando chegar.</div></div>';
  camadaRota.clearLayers(); camadaPts.clearLayers();
  $('#mapaInfo').classList.remove('vis');
  try {
    const r = await fetch('/api/historico?id='+encodeURIComponent(S.sel.id)+'&dia='+S.diaEscolhido);
    const h = await r.json();
    if (!r.ok) throw new Error(h.erro || 'HTTP '+r.status);
    S.hist = h;
    renderTimeline(h);
    desenharRota(h);
    $('#btnCSV').disabled = false;
  } catch (err) {
    $('#tlCorpo').innerHTML = '<div class="tl-vazio"><div class="tl-vazio-titulo">Nao foi possivel carregar</div><div class="tl-vazio-sub">'+esc(err.message)+'</div></div>';
  } finally {
    btn.disabled = false;
  }
}

function horaEmMin(hhmm) { const [h,m] = hhmm.split(':').map(Number); return h*60+m; }

function renderTimeline(h) {
  if (!h.trechos?.length) {
    $('#tlCorpo').innerHTML = '<div class="tl-vazio"><div class="tl-vazio-titulo">Sem dados neste dia</div><div class="tl-vazio-sub">O GAUSS nao tem posicoes para '+esc(S.sel.placa)+' em '+h.dia.split('-').reverse().join('/')+'.</div></div>';
    return;
  }
  const r = h.resumo;
  const fonte = ({cache:'cache local',incremental:'atualizado',gauss:'baixado do GAUSS'})[h.fonte] ?? '';
  const inicioMin = horaEmMin(r.primeiro.slice(11,16));
  const fimMin    = horaEmMin(r.ultimo.slice(11,16));
  const totalMin  = Math.max(fimMin-inicioMin,1);
  const barraSeg = h.trechos.map(t => {
    const e = ESTADOS[t.estado]; if (!e) return '';
    const ini = horaEmMin(t.inicio.slice(11,16));
    const dur = Math.max(horaEmMin(t.fim.slice(11,16))-ini,1);
    return '<span style="width:'+(dur/totalMin*100)+'%;background:'+e.hex+';min-width:2px" title="'+e.label+': '+fmtMin(t.duracao_min)+'"></span>';
  }).join('');
  const statsLinhas = [
    {label:'Distancia', val:r.km.toLocaleString('pt-BR')+' km'},
    {label:'Vel. max',  val:r.vel_max+' km/h'},
    {label:'Deslocamento', val:fmtMin(r.movimento_min)},
    {label:h.temRpm?'Parado ligado':'Parado', val:fmtMin(h.temRpm?r.parado_ligado_min:r.parado_min)},
    ...(h.temRpm?[{label:'Desligado',val:fmtMin(r.desligado_min)}]:[]),
    ...(r.sem_sinal_min?[{label:'Sem sinal',val:fmtMin(r.sem_sinal_min)}]:[]),
    ...(h.motor2?[{label:'Motor 2º ligado',val:'<span style="color:#0891b2">⚙ '+fmtMin(r.motor2_ligado_min)+'</span>'}]:[]),
  ];
  // faixa do motor secundário, na mesma escala da barra principal
  const seg = (hms) => { const [a,b,c] = hms.split(':').map(Number); return a*3600+b*60+(c||0); };
  const s0 = seg(r.primeiro.slice(11,19)), s1 = seg(r.ultimo.slice(11,19)), sTot = Math.max(s1-s0,1);
  const barraM2 = h.motor2 ? '<div class="barra-m2" id="barraM2" title="Motor secundário ligado">'+h.motor2.intervalos.map(([a,b]) => '<span style="left:'+((seg(a)-s0)/sTot*100)+'%;width:'+Math.max((seg(b)-seg(a))/sTot*100,0.3)+'%" title="Motor 2º ligado '+a.slice(0,5)+'–'+b.slice(0,5)+'"></span>').join('')+'</div><div class="barra-m2-rot">⚙ motor secundário ligado'+(h.motor2.placa?' ('+esc(h.motor2.placa)+')':'')+'</div>' : (h.motor2_erro ? '<div class="barra-m2-rot">motor secundário não carregou: '+esc(h.motor2_erro)+'</div>' : '');
  const trechoHTML = h.trechos.map((t,i) => {
    const e = ESTADOS[t.estado] ?? {label:t.estado,hex:'#888',ic:'?',icBg:'#eee'};
    let desc = e.label, sub = '';
    if (t.estado==='movimento') { desc=t.percurso?.length?t.percurso.join(' > '):e.label; sub=''+(t.km??0)+' km - max '+(t.vel_max??'?')+' km/h'; }
    else if (t.estado!=='sem_sinal') { sub=esc(t.local||''); }
    else { sub='Nenhuma posicao recebida'; }
    if (t.motor2_min) sub += (sub?' · ':'')+'<span style="color:#0891b2;font-weight:700">⚙ 2º ligado '+fmtMin(t.motor2_min)+'</span>';
    return '<button class="trecho-item" data-i="'+i+'"><span class="trecho-ic" style="background:'+e.icBg+';color:'+e.hex+'">'+e.ic+'</span><span class="trecho-desc">'+esc(desc)+'</span><span class="trecho-sub">'+sub+'</span><span class="trecho-hora"><span>'+t.inicio.slice(11,16)+'-'+t.fim.slice(11,16)+'</span><br><span class="trecho-dur">'+fmtMin(t.duracao_min)+'</span></span></button>';
  }).join('');
  const areasHTML = r.areas?.length ? '<div class="secao-label">Tempo por area</div>'+r.areas.slice(0,8).map(a => '<div style="padding:6px 16px 2px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px;font-size:12px"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(a.area)+'</span><b class="tnum">'+fmtMin(a.min)+'</b><div style="grid-column:1/3;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin-bottom:4px"><span style="display:block;height:100%;width:'+(a.min/r.areas[0].min*100)+'%;background:var(--brand-2)"></span></div></div>').join('') : '';
  const avisoRpm = h.rpm_travado ? '<div class="faixa faixa-atencao" style="margin:8px 16px 0">RPM do rastreador travado em '+h.rpm_travado+' o dia todo: não dá para afirmar motor ligado/desligado, as paradas aparecem só como "Parado".</div>' : '';
  $('#tlCorpo').innerHTML =
    '<div class="tl-veiculo-header"><div class="tl-veiculo-info"><div class="tl-placa">'+esc(S.sel.placa)+'</div><div class="tl-vaga">'+esc(S.sel.vaga||'Sem vaga')+' - '+h.dia.split('-').reverse().join('/')+' <span style="opacity:.7">'+fonte+'</span></div></div></div>'+
    avisoRpm+
    '<div class="resumo-grade">'+statsLinhas.map(s => '<div class="resumo-cel"><span class="rc-val tnum">'+s.val+'</span><span class="rc-label">'+s.label+'</span></div>').join('')+'</div>'+
    '<div class="barra-tempo-wrap"><div class="barra-tempo-titulo">Linha do tempo · clique para ir ao horário</div>'+
      '<div class="barra-tempo" id="barraTempo">'+barraSeg+'<div class="cursor-play" id="cursorPlay" style="left:0"></div></div>'+barraM2+
      '<div class="barra-horas"><span>'+r.primeiro.slice(11,16)+'</span><span>'+r.ultimo.slice(11,16)+'</span></div>'+
      '<div class="player">'+
        '<button class="btn btn-primario btn-mini" id="btnPlay" title="Espaço">▶ Reproduzir</button>'+
        '<select class="input" id="velPlay" title="Velocidade">'+[[10,'10x'],[30,'30x'],[60,'1 min/s'],[120,'2 min/s'],[300,'5 min/s'],[900,'15 min/s']].map(([v,l]) => '<option value="'+v+'"'+(v===120?' selected':'')+'>'+l+'</option>').join('')+'</select>'+
        '<label title="Paradas passam 20x mais rápido"><input type="checkbox" id="pularParadas" checked> Acelerar paradas</label>'+
        '<label><input type="checkbox" id="seguirPlay" checked> Seguir caminhão</label>'+
      '</div>'+
      '<div class="play-info" id="playInfo"></div>'+
    '</div>'+
    areasHTML+
    '<div class="secao-label" style="margin-top:var(--sp-2)">Apontamento ('+h.trechos.length+' trechos)</div>'+
    '<div>'+trechoHTML+'</div>';
  // onclick (e não addEventListener): recarregar o histórico não pode acumular handlers
  $('#tlCorpo').onclick = (e) => {
    const b = e.target.closest('.trecho-item');
    if (!b) return;
    const i = Number(b.dataset.i);
    focarTrecho(i);
    document.querySelectorAll('.trecho-item').forEach(el => el.classList.toggle('sel', Number(el.dataset.i)===i));
    Player.irPara(seg(h.trechos[i].inicio.slice(11,19)), false);
  };
  Player.preparar(h);
}

function desenharRota(h) {
  camadaRota.clearLayers(); camadaPts.clearLayers();
  if (!h.pontos?.length) return;
  // uma linha por sequência de mesmo estado; contorno escuro por baixo para destacar
  // no satélite e sobre as cercas coloridas
  const seqs = [];
  for (const [lat,lng,,, estado] of h.pontos) {
    const atual = seqs.at(-1);
    if (atual && atual.estado===estado) { atual.pts.push([lat,lng]); continue; }
    if (atual) atual.pts.push([lat,lng]); // emenda sem buraco
    seqs.push({ estado, pts:[[lat,lng]] });
  }
  for (const q of seqs) L.polyline(q.pts,{color:'#0b1220',weight:12,opacity:0.75,lineJoin:'round'}).addTo(camadaRota);
  for (const q of seqs) L.polyline(q.pts,{color:ESTADOS[q.estado]?.hex??'#888',weight:7,opacity:1,lineJoin:'round',lineCap:'round'}).addTo(camadaRota);
  h.trechos.forEach((t,i) => {
    if (t.estado==='movimento'||t.estado==='sem_sinal'||t.duracao_min<10||t.lat==null) return;
    const e = ESTADOS[t.estado];
    L.circleMarker([t.lat,t.lng],{radius:7,color:'#fff',weight:2,fillColor:e?.hex??'#888',fillOpacity:1})
     .bindTooltip(t.inicio.slice(11,16)+'-'+t.fim.slice(11,16)+' - '+(e?.label??t.estado)+' - '+fmtMin(t.duracao_min)+'<br>'+(t.local??''),{sticky:true})
     .on('click',()=>{ focarTrecho(i); document.querySelectorAll('.trecho-item').forEach(el=>el.classList.toggle('sel',Number(el.dataset.i)===i)); })
     .addTo(camadaPts);
  });
  const ini = h.pontos[0], fim = h.pontos.at(-1);
  L.marker([ini[0],ini[1]],{icon:L.divIcon({html:'<div class="mk" style="--c:#0f766e">Inicio '+ini[2].slice(0,5)+'</div>',className:'',iconSize:null})}).addTo(camadaRota);
  L.marker([fim[0],fim[1]],{icon:L.divIcon({html:'<div class="mk" style="--c:#1f3864">Fim '+fim[2].slice(0,5)+'</div>',className:'',iconSize:null})}).addTo(camadaRota);
  mapa.fitBounds(L.latLngBounds(h.pontos.map(p=>[p[0],p[1]])).pad(0.06));
}

function focarTrecho(i) {
  S.trechoSel = i;
  const t = S.hist?.trechos[i]; if (!t) return;
  const ini = t.inicio.slice(11,19), fim = t.fim.slice(11,19);
  const pts = (S.hist.pontos??[]).filter(p=>p[2]>=ini&&p[2]<=fim).map(p=>[p[0],p[1]]);
  if (pts.length>1) mapa.fitBounds(L.latLngBounds(pts).pad(0.2),{maxZoom:18});
  else if (t.lat!=null) mapa.flyTo([t.lat,t.lng],17);
  const e = ESTADOS[t.estado];
  const info = $('#mapaInfo');
  info.className = 'mapa-info vis';
  info.innerHTML = '<div class="mapa-info-placa">'+esc(S.sel.placa)+'</div><div class="mapa-info-linha"><b>'+(e?.label??t.estado)+'</b></div><div class="mapa-info-linha">'+t.inicio.slice(11,16)+' - '+t.fim.slice(11,16)+' - <b>'+fmtMin(t.duracao_min)+'</b></div>'+(t.estado==='movimento'?'<div class="mapa-info-linha">'+t.km+' km - max '+t.vel_max+' km/h</div>':'')+(t.local?'<div class="mapa-info-linha" style="margin-top:4px;color:var(--text-3)">'+esc(t.local)+'</div>':'');
}

$('#btnCSV').onclick = () => {
  const h = S.hist; if (!h) return;
  const cab = ['placa','dia','inicio','fim','duracao_min','situacao','local_ou_percurso','km','vel_max'];
  const linhas = h.trechos.map(t => [S.sel.placa,h.dia,t.inicio.slice(11,19),t.fim.slice(11,19),t.duracao_min,ESTADOS[t.estado]?.label??t.estado,t.estado==='movimento'?(t.percurso??[]).join(' > '):(t.local??''),t.km??'',t.vel_max??'']);
  const csv = [cab,...linhas].map(l=>l.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));
  a.download = 'timeline-'+S.sel.placa+'-'+h.dia+'.csv';
  a.click(); URL.revokeObjectURL(a.href);
};

/* ---------- reprodução da trajetória ----------
   Tempo virtual em segundos do dia. A cada quadro avança (tempo real × velocidade),
   acha o ponto do GAUSS daquele instante (busca binária) e interpola até o próximo.
   Buraco > 10 min entre pontos não é interpolado: o caminhão fica parado no último
   ponto conhecido em vez de "voar" em linha reta. */
const Player = (() => {
  const camada = L.layerGroup().addTo(mapa);
  const segDe = (hms) => { const [a,b,c] = hms.split(':').map(Number); return a*3600+b*60+(c||0); };
  const fmtHora = (x) => pad(Math.floor(x/3600))+':'+pad(Math.floor(x%3600/60))+':'+pad(Math.floor(x%60));
  let pts = [], t0 = 0, t1 = 0, t = 0, tocando = false, raf = null, ultimoTs = 0;
  let idxPerc = -1, rumo = 0, trechoAtual = -1, trechosSeg = [], marcador = null, percorrido = null, placa = '';

  function idxEm(x) {
    if (x <= pts[0].s) return 0;
    let lo = 0, hi = pts.length - 1;
    while (lo < hi) { const m = (lo + hi + 1) >> 1; if (pts[m].s <= x) lo = m; else hi = m - 1; }
    return lo;
  }
  function rumoEntre(a, b) {
    const dy = b.lat - a.lat, dx = (b.lng - a.lng) * Math.cos(a.lat * Math.PI / 180);
    if (Math.abs(dy) + Math.abs(dx) < 2e-6) return null; // parado: mantém o rumo anterior
    return (Math.atan2(dx, dy) * 180 / Math.PI + 360) % 360;
  }
  function posEm(x) {
    const i = idxEm(x), a = pts[i], b = pts[i + 1];
    let lat = a.lat, lng = a.lng;
    if (b && b.s - a.s <= 600 && x > a.s) {
      const f = Math.min(1, (x - a.s) / (b.s - a.s));
      lat = a.lat + (b.lat - a.lat) * f; lng = a.lng + (b.lng - a.lng) * f;
    }
    if (b) { const r = rumoEntre(a, b); if (r != null) rumo = r; }
    return { i, lat, lng, p: a };
  }

  function preparar(h) {
    limpar();
    if (!h.pontos?.length) return;
    placa = S.sel?.placa ?? '';
    pts = h.pontos.map(p => ({ lat: p[0], lng: p[1], s: segDe(p[2]), vel: p[3], estado: p[4], m2: p[5] }));
    t0 = pts[0].s; t1 = pts.at(-1).s; t = t0;
    trechosSeg = h.trechos.map(tr => [segDe(tr.inicio.slice(11,19)), segDe(tr.fim.slice(11,19))]);
    percorrido = L.polyline([], { color: '#ffffff', weight: 3, opacity: 0.95, dashArray: '2 7', lineCap: 'round', interactive: false }).addTo(camada);
    marcador = L.marker([pts[0].lat, pts[0].lng], { icon: L.divIcon({ className: '', iconSize: null, html: '<div class="mk-play"><span class="seta-play">▲</span></div>' }), zIndexOffset: 2000, interactive: false }).addTo(camada);
    $('#btnPlay').onclick = alternar;
    arrastar($('#barraTempo'));
    if ($('#barraM2')) arrastar($('#barraM2'));
    desenhar(false);
  }
  // clicar/arrastar na linha do tempo leva o caminhão para aquele horário
  function arrastar(el) {
    const ir = (ev) => { const r = el.getBoundingClientRect(); irPara(t0 + Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width)) * (t1 - t0), !tocando); };
    el.onpointerdown = (ev) => { el.setPointerCapture(ev.pointerId); ir(ev); el.onpointermove = ir; };
    el.onpointerup = () => { el.onpointermove = null; };
  }
  function irPara(x, centralizar) { if (!pts.length) return; t = Math.min(t1, Math.max(t0, x)); desenhar(centralizar); }
  function alternar() { tocando ? pausar() : tocar(); }
  function tocar() {
    if (!pts.length) return;
    if (t >= t1) t = t0;
    tocando = true; ultimoTs = performance.now();
    $('#btnPlay').textContent = '⏸ Pausar';
    $('#playHud').classList.add('vis');
    const pos = posEm(t);
    if (!mapa.getBounds().contains([pos.lat, pos.lng])) mapa.setView([pos.lat, pos.lng], Math.max(mapa.getZoom(), 16));
    raf = requestAnimationFrame(passo);
  }
  function pausar() {
    tocando = false; cancelAnimationFrame(raf);
    const b = $('#btnPlay'); if (b) b.textContent = '▶ Reproduzir';
  }
  function passo(ts) {
    if (!tocando) return;
    const dt = Math.min(0.25, (ts - ultimoTs) / 1000); ultimoTs = ts;
    const parado = pts[idxEm(t)].estado !== 'movimento';
    const acelera = $('#pularParadas')?.checked && parado ? 20 : 1;
    t = Math.min(t1, t + dt * Number($('#velPlay')?.value || 120) * acelera);
    desenhar(false);
    if (t >= t1) { pausar(); return; }
    raf = requestAnimationFrame(passo);
  }
  function desenhar(centralizar) {
    const pos = posEm(t);
    const e = ESTADOS[pos.p.estado];
    marcador.setLatLng([pos.lat, pos.lng]);
    const el = marcador.getElement();
    if (el) {
      const mk = el.querySelector('.mk-play');
      mk.style.setProperty('--c', e?.hex ?? '#888');
      el.querySelector('.seta-play').style.transform = 'rotate(' + rumo + 'deg)';
      const selo = mk.querySelector('.m2');
      if (pos.p.m2 === 1 && !selo) mk.insertAdjacentHTML('beforeend', '<span class="m2" title="Motor secundário ligado">⚙</span>');
      else if (pos.p.m2 !== 1 && selo) selo.remove();
    }
    // rastro já percorrido (branco tracejado por cima da rota)
    if (pos.i !== idxPerc) {
      idxPerc = pos.i;
      percorrido.setLatLngs(pts.slice(0, pos.i + 1).map(p => [p.lat, p.lng]).concat([[pos.lat, pos.lng]]));
    } else {
      const ll = percorrido.getLatLngs();
      if (ll.length) { ll[ll.length - 1] = L.latLng(pos.lat, pos.lng); percorrido.setLatLngs(ll); }
    }
    const c = $('#cursorPlay'); if (c) c.style.left = ((t - t0) / Math.max(t1 - t0, 1) * 100) + '%';
    const vel = pos.p.estado === 'movimento' ? pos.p.vel + ' km/h' : '';
    const m2 = pos.p.m2 === 1 ? ' · <span style="color:#0891b2;font-weight:700">⚙ motor 2º ligado</span>' : (pos.p.m2 === 0 ? ' · motor 2º desligado' : '');
    const pi = $('#playInfo'); if (pi) pi.innerHTML = '<b>' + fmtHora(t) + '</b> · ' + (e?.label ?? pos.p.estado) + (vel ? ' · ' + vel : '') + m2;
    $('#playHud').innerHTML = '<b>' + fmtHora(t) + '</b>' + esc(placa) + ' · ' + (e?.label ?? '') + (vel ? ' · ' + vel : '') + (pos.p.m2 === 1 ? ' · ⚙ 2º ligado' : '');
    // destaca no apontamento o trecho em que o caminhão está
    const ti = trechosSeg.findIndex(([a, b]) => t >= a && t < b);
    if (ti >= 0 && ti !== trechoAtual) {
      trechoAtual = ti;
      document.querySelectorAll('.trecho-item').forEach(x => x.classList.toggle('sel', Number(x.dataset.i) === ti));
      if (tocando) document.querySelector('.trecho-item[data-i="' + ti + '"]')?.scrollIntoView({ block: 'nearest' });
    }
    if (centralizar) mapa.setView([pos.lat, pos.lng], Math.max(mapa.getZoom(), 16));
    else if (tocando && $('#seguirPlay')?.checked && !mapa.getBounds().pad(-0.25).contains([pos.lat, pos.lng])) {
      mapa.panTo([pos.lat, pos.lng], { animate: true, duration: 0.5 });
    }
  }
  function limpar() {
    pausar(); camada.clearLayers();
    pts = []; idxPerc = -1; trechoAtual = -1; marcador = null; percorrido = null;
    $('#playHud').classList.remove('vis');
  }
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && pts.length && !e.target.closest('input, select, textarea, button')) { e.preventDefault(); alternar(); }
  });
  return { preparar, irPara, limpar };
})();

async function iniciar() {
  await Promise.all([carregarVeiculos(), carregarDias()]);
  const p = new URLSearchParams(location.search);
  if (p.get('v')) {
    const sec = secundarios.find(x => x.id===p.get('v') || x.placa===p.get('v'));
    const alvo = sec ? sec.motor2_de : p.get('v');
    const v = todosVeiculos.find(x => x.id===alvo || x.placa===alvo);
    if (v) {
      S.sel = {id:v.id, placa:v.placa, vaga:v.vaga||''};
      buscaEl.value = v.placa;
      if (p.get('dia')) { S.diaEscolhido=p.get('dia'); $('#diaSel').value=p.get('dia'); }
      $('#btnCarregar').disabled = false;
      carregarHistorico();
    }
  }
}
iniciar();
</script>
