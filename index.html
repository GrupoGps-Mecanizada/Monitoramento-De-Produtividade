<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1f3864">
<title>Localização — Monitoramento GrupoGPS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%231f3864%22/><path d=%22M50 18c-13 0-23 10-23 23 0 17 23 41 23 41s23-24 23-41c0-13-10-23-23-23z%22 fill=%22%230ca30c%22/><circle cx=%2250%22 cy=%2241%22 r=%229%22 fill=%22%231f3864%22/></svg>">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="api-supabase.js"></script>
<link rel="stylesheet" href="mobile.css">
<script src="mobile.js" defer></script>
</head>
<body>
<header class="app-header">
  <div class="app-header-inner">
    <div class="brand">
      <div class="brand-mark">GPS</div>
      <div class="brand-text">
        <strong>Monitoramento de Localização</strong>
        <span>GrupoGPS · Usiminas</span>
      </div>
    </div>
    <nav class="nav">
      <a href="./" class="ativo">Localização</a>
      <a href="timeline.html">Timeline</a>
      <a href="alertas.html">Alertas</a>
    </nav>
    <div class="header-right">
      <span class="texto-3 tnum" id="txtCarga" style="font-size:11px;font-weight:600"></span>
      <span class="live-chip pulsando" id="chipAtualizacao"><span class="live-dot"></span><span id="txtAtualizacao">conectando…</span></span>
      <button class="icon-btn" id="btnTema" title="Alternar tema" aria-label="Alternar tema">☾</button>
    </div>
  </div>
</header>

<div id="faixaErro" class="faixa faixa-atencao" hidden></div>
<div id="faixaPausa" class="faixa" hidden style="cursor:pointer"></div>


<main class="layout">
  <aside class="painel" id="painel">
    <!-- lista / áreas / eventos -->
    <div id="vistaPrincipal" class="vista">
      <div class="painel-topo">
        <div class="segmentado" role="tablist" id="abas">
          <button data-aba="veiculos" class="ativo">Veículos <span class="cnt" id="cntVeiculos"></span></button>
          <button data-aba="areas">Áreas <span class="cnt" id="cntAreas"></span></button>
          <button data-aba="eventos">Eventos <span class="cnt" id="cntEventos"></span></button>
        </div>
        <div class="filtros" id="filtrosVeiculos">
          <input class="input" id="busca" type="search" placeholder="Buscar placa, vaga, área, motorista…" autocomplete="off">
          <div class="filtro-ativo" id="filtroAtivo" hidden></div>
        </div>
        <div class="filtros" id="filtrosEventos" hidden>
          <div class="linha-filtro">
            <select class="input" id="diaEventos"></select>
            <input class="input" id="buscaEventos" type="search" placeholder="Placa ou área…" autocomplete="off">
          </div>
          <div class="chips" id="tiposEventos"></div>
        </div>
      </div>
      <div class="painel-corpo" id="corpo"></div>
    </div>

    <!-- detalhe de um veículo -->
    <div id="vistaDetalhe" class="vista" hidden></div>
  </aside>

  <div class="mapa-wrap">
    <div id="mapa"></div>
    <div class="legenda-mapa" id="legenda"></div>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
